app:
  name: 'Hawkins: The Other Side'
  slogan: '转动电台刻度，寻找字母灯墙另一侧的信号'
  description: |-
    把一间充满 1980 年代气息的客厅，放到你面前的立体微缩空间里。在“霍金斯”与“颠倒世界”之间切换，观察沙发、电视、藤蔓和字母灯墙的变化。
    用复古接收机调节频率，信号锁定后点击“收听”，记住灯墙依次点亮的字母，再通过字母键回复并“发送”。“缓慢转动”可查看场景，“重置”可重新开始。
    支持简体中文与英文界面，跟随系统或 Android 应用语言设置；谜题字母保留拉丁字符。原生 PICO Spatial 应用，以视觉信号为主，应用本身无需账号或联网。
    Place a miniature 1980s living room in front of you. Switch between Hawkins and the Upside Down, tune the receiver, watch the alphabet lights, then enter and transmit the reply. Slow Sweep rotates the room; Reset starts again. English and Simplified Chinese UI and accessibility labels are supported. The puzzle uses Latin letters and visual signals; no app account or network connection is required.
    独立、非官方粉丝灵感技术原型，使用程序化原创场景，不代表影视作品官方产品。已在 Swan 真机运行，其他机型与长期性能尚未完整验证。 Independent unofficial fan-inspired prototype; not affiliated with the television production. Tested on a physical Swan; other devices and long-duration performance are not fully verified.
  tags: ['空间解谜', '复古电台', '微缩场景', '休闲']
  category: game
  icon: assets/icon.png
  landscape: assets/landscape.png
  detail_images:
    - assets/detail-1.png
    - assets/detail-2.png
    - assets/detail-3.png
    - assets/detail-4.png
  videos:
    - file: assets/demo.mp4
      cover: assets/demo-cover.png
version:
  name: 1.0.2
  notes: '新增简体中文与英文界面、状态提示和无障碍文案；使用 Android 字符串资源并支持应用语言切换。保留原创电台图标与完整调频解谜流程。 Added English/Simplified Chinese UI and accessibility resources with per-app locale support.'
build:
  repo_url: https://github.com/MtxZion3/hawkins-the-other-side
  repo_visibility: public
  tech_stack: android_spatial
  ai_tool: Codex CLI
  ai_model: GPT-6
  features: [mixed_reality]
  teammates: []
